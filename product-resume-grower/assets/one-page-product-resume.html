<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #eceff1; color: #15191d; }
    body { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 10.4pt; line-height: 1.42; }
    .page { width: 210mm; min-height: 297mm; margin: 12mm auto; padding: 13mm 15mm 12mm; background: #fff; box-shadow: 0 2mm 8mm rgba(0,0,0,.10); }
    header { padding-bottom: 4mm; border-bottom: .55mm solid #181c20; }
    h1 { margin: 0; font-size: 22pt; line-height: 1.1; letter-spacing: .06em; }
    .target { margin-top: 1.4mm; font-size: 10.5pt; font-weight: 650; color: #343a40; }
    .contact { margin-top: 2.3mm; display: flex; flex-wrap: wrap; gap: 1.2mm 4mm; font-size: 9.3pt; color: #454b51; }
    section { margin-top: 4.2mm; }
    h2 { margin: 0 0 2.2mm; padding-bottom: 1.1mm; border-bottom: .25mm solid #9aa1a8; font-size: 11.5pt; line-height: 1.2; letter-spacing: .08em; }
    .summary-list, .bullets { margin: 0; padding-left: 4.8mm; }
    li { margin: 0 0 1.2mm; padding-left: .8mm; }
    .entry { margin-bottom: 3mm; break-inside: avoid; }
    .entry:last-child { margin-bottom: 0; }
    .entry-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4mm; align-items: baseline; }
    .entry-title { font-weight: 700; }
    .entry-date { white-space: nowrap; font-size: 9.2pt; color: #42484e; }
    .entry-subtitle { margin: .7mm 0 1.1mm; font-size: 9.2pt; color: #555d64; }
    .skills { display: grid; gap: 1.1mm; }
    .skill-line strong { display: inline-block; min-width: 24mm; }
    a { color: inherit; text-decoration: none; }
    @media print {
      html, body { background: #fff; }
      .page { margin: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>{{NAME}}</h1>
      <div class="target">{{TARGET_ROLE}}</div>
      <div class="contact">{{CONTACT}}</div>
    </header>
    {{SUMMARY_SECTION}}
    {{EDUCATION_SECTION}}
    {{EXPERIENCE_SECTION}}
    {{PROJECTS_SECTION}}
    {{SKILLS_SECTION}}
    {{CERTIFICATES_SECTION}}
  </main>
</body>
</html>
